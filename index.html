<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iCloud Calendar Wallpaper</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="wallpaper-bg" class="wallpaper-bg"></div>

    <div id="calendar-card" class="calendar-card">
        <header class="calendar-header">
            <div class="calendar-header-left">
                <button id="collapse-btn" class="collapse-btn" type="button" aria-label="Toggle calendar">&minus;</button>
                <div id="month-nav" class="month-nav">
                    <button id="month-prev" class="month-nav-btn" type="button" aria-label="Previous month">&lsaquo;</button>
                    <button id="month-next" class="month-nav-btn" type="button" aria-label="Next month">&rsaquo;</button>
                    <button id="month-today" class="month-nav-btn month-today-btn hidden" type="button">Today</button>
                </div>
                <h1 id="header-title" class="header-title"></h1>
            </div>
            <div class="calendar-header-right">
                <span id="sync-health-dot" class="sync-health-dot offline" title="Sync service offline" aria-label="Sync service offline"></span>
                <span id="header-clock" class="header-clock"></span>
                <button id="add-event-btn" class="header-action-btn" type="button">+ Event</button>
                <button id="settings-btn" class="header-action-btn" type="button" title="Settings">Settings</button>
                <button id="position-lock-btn" class="position-lock-btn" type="button" aria-label="Lock position" title="Lock position"></button>
                <input id="wallpaper-file" type="file" accept="image/*" class="hidden-input">
                <div id="view-dropdown" class="view-dropdown custom-select" aria-label="Calendar view">
                    <input id="view-mode" type="hidden" value="month">
                    <div class="custom-select-control">
                        <button id="view-trigger" class="custom-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">Month</button>
                        <div id="view-list" class="custom-select-list hidden" role="listbox">
                            <button class="custom-select-option active" type="button" data-value="month" role="option" aria-selected="true">Month</button>
                            <button class="custom-select-option" type="button" data-value="day" role="option" aria-selected="false">Day</button>
                            <button class="custom-select-option" type="button" data-value="upcoming" role="option" aria-selected="false">Upcoming</button>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div id="calendar-body" class="calendar-body">
            <div id="view-month" class="view-panel"></div>
            <div id="view-day" class="view-panel hidden"></div>
            <div id="view-upcoming" class="view-panel hidden"></div>
        </div>

        <footer class="calendar-footer">
            <button id="sync-btn" class="sync-btn" type="button">Sync</button>
            <span id="sync-status" class="sync-status"></span>
        </footer>
        <div id="calendar-resize-handle" class="calendar-resize-handle" aria-hidden="true"></div>
    </div>

    <div id="event-panel-host" class="event-panel hidden"></div>
    <div id="settings-panel-host" class="settings-panel hidden"></div>
    <div id="notes-card" class="notes-card hidden">
        <header id="notes-header" class="notes-header">
            <div class="notes-header-left">
                <button id="notes-collapse-btn" class="collapse-btn" type="button" aria-label="Toggle notes">-</button>
                <h2 class="notes-title">Notes</h2>
            </div>
            <div class="notes-header-right">
                <label class="notes-toggle">
                    <input id="notes-hide-completed" type="checkbox">
                    <span>Hide completed</span>
                </label>
                <button id="notes-position-lock-btn" class="position-lock-btn" type="button" aria-label="Lock position" title="Lock position"></button>
            </div>
        </header>
        <div id="notes-body" class="notes-body">
            <div id="notes-file-dropdown" class="notes-file-dropdown custom-select" aria-label="Notes file">
                <input id="notes-file-path" type="hidden" value="">
                <div class="custom-select-control">
                    <button id="notes-file-trigger" class="custom-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">No notes</button>
                    <div id="notes-file-list" class="custom-select-list hidden" role="listbox"></div>
                </div>
            </div>
            <div id="notes-toolbar" class="notes-toolbar">
                <span id="notes-selection-label" class="notes-selection-label">No task selected</span>
                <div class="notes-toolbar-actions">
                    <button type="button" id="notes-tool-add" class="notes-tool-btn">+ Task</button>
                    <button type="button" id="notes-tool-open" class="notes-tool-btn">Open file</button>
                    <span class="notes-toolbar-sep" aria-hidden="true"></span>
                    <button type="button" id="notes-tool-up" class="notes-tool-btn" disabled>Up</button>
                    <button type="button" id="notes-tool-down" class="notes-tool-btn" disabled>Down</button>
                    <button type="button" id="notes-tool-outdent" class="notes-tool-btn" disabled>Outdent</button>
                    <button type="button" id="notes-tool-indent" class="notes-tool-btn" disabled>Indent</button>
                    <button type="button" id="notes-tool-edit" class="notes-tool-btn" disabled>Edit</button>
                    <button type="button" id="notes-tool-subtask" class="notes-tool-btn" disabled>Subtask</button>
                    <button type="button" id="notes-tool-delete" class="notes-tool-btn notes-tool-btn-danger" disabled>Delete</button>
                </div>
            </div>
            <div id="notes-content" class="notes-content"></div>
        </div>
        <div id="notes-resize-handle" class="notes-resize-handle" aria-hidden="true"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/background.js"></script>
    <script src="js/api.js"></script>
    <script src="js/eventDates.js"></script>
    <script src="js/views.js"></script>
    <script src="js/position.js"></script>
    <script src="js/resize.js"></script>
    <script src="js/wallpaperPicker.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/eventForm.js"></script>
    <script src="js/dayPanel.js"></script>
    <script src="js/eventDetail.js"></script>
    <script src="js/notes.js"></script>
    <script src="js/wpListener.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
